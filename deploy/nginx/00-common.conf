# http 段公共配置，必须放在 conf.d 里（map 只能在 http 上下文定义）。

# 按请求头决定 WebSocket 升级，普通请求则关闭连接复用协商
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 日志格式：带上真实客户端 IP（经代理后 $remote_addr 是 nginx 自己）
log_format lanfile '$remote_addr "$request" $status $body_bytes_sent '
                   'xff="$http_x_forwarded_for" ua="$http_user_agent"';

# lanfile 服务入口：浏览器 → nginx:8080/lanfile/ → 127.0.0.1:41730
#
# 按路径前缀分发：lanfile 挂在 /lanfile/，以后再加服务就各占一个前缀，
# 安全组始终只需要放行 8080 一个端口。
#
# 目前按「公网 IP:8080」直接访问，所以这个 server 同时也是 default_server。
# 以后绑了域名，把 server_name 改成域名，再加一个 listen 8080 default_server 的
# 444 兜底 server 块（拒绝未知 Host），避免别人的域名解析到你这里也能用。

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # 不回显 nginx 版本号
    server_tokens off;

    # 单文件上限由后端控制（-max-mb 500），这里设 0 表示不限，避免 nginx 先返回 413
    client_max_body_size 0;
    client_body_timeout 1h;

    access_log /var/log/nginx/lanfile.access.log lanfile;
    error_log  /var/log/nginx/lanfile.error.log;

    # 根路径先跳进 lanfile；以后服务多了，这里换成「服务导航页」
    location = / {
        return 302 /lanfile/;
    }

    # 注意：proxy_pass 后面不带路径，原样透传 /lanfile/... 给后端；
    # 后端用 -base /lanfile/ 自己剥掉前缀，两边不要重复改写路径。
    location /lanfile/ {
        proxy_pass http://127.0.0.1:41730;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # 其余路径一律 404，避免未定义的服务被误转发
    location / {
        return 404;
    }
}

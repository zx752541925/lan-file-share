# 反向代理公共参数：所有服务共用，改这一处对所有服务生效。
# 用法：在 location 里 include /etc/nginx/snippets/proxy-common.conf;

proxy_http_version 1.1;

# WebSocket 升级（lanfile 的 /ws 是长连接，缺这两行会连不上）
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# 真实来源信息：lanfile 靠 X-Forwarded-For 识别访客 IP、X-Forwarded-Proto 判断 HTTPS
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 大文件：关掉请求缓冲，让上传边收边转给后端，不在 nginx 落临时文件
proxy_request_buffering off;
proxy_buffering off;
proxy_max_temp_file_size 0;

# 超时：手机传大文件、看视频拖动都需要长超时
proxy_connect_timeout 15s;
proxy_send_timeout 1h;
proxy_read_timeout 1h;

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6fed" />
  <title>局域网文件传输</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-view="chat">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">⇄</span>
        <div class="brand-text">
          <h1>局域网文件传输</h1>
          <p class="brand-sub">会话 <b id="sessionName">—</b> · 手机连同一 Wi-Fi 即可互传</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="status" id="connStatus"><i></i><span id="connText">连接中…</span></span>
        <button type="button" class="top-btn" id="qrBtn" title="扫码加入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <path d="M14 14h3v3h-3zM20 14v3M17 20h4M14 20h.01" />
          </svg>
          <span>扫码加入</span>
        </button>
        <button type="button" class="top-btn" id="historyBtn" title="历史会话" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 4v4h4M12 8v4l3 2" />
          </svg>
          <span>历史会话</span>
        </button>
        <button type="button" class="user-btn" id="userBtn" title="点击修改昵称">
          <span class="avatar" id="userAvatar">我</span>
          <span id="userName">我的设备</span>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="panel panel-files" aria-label="共享文件">
        <div class="panel-head">
          <h2>共享文件</h2>
          <span class="badge" id="fileCount">0 个</span>
        </div>
        <label class="dropzone" id="dropzone">
          <input type="file" id="pickTop" multiple hidden />
          <span class="dropzone-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" />
              <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
            </svg>
          </span>
          <strong>点击或拖拽文件到此处</strong>
          <span class="dropzone-hint">局域网内其他设备可立即下载</span>
        </label>
        <ul class="file-list" id="fileList"></ul>
      </section>

      <section class="panel panel-chat" aria-label="聊天">
        <div class="messages" id="messages"></div>
        <div class="upload-tray" id="uploadTray" hidden></div>
        <form class="composer" id="composer">
          <button type="button" class="icon-btn" id="attachBtn" title="选择文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
            </svg>
          </button>
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift + Enter 换行"></textarea>
          <button type="submit" class="send-btn" title="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2 11 13" />
              <path d="M22 2 15 22l-4-9-9-4 20-7z" />
            </svg>
            <span>发送</span>
          </button>
          <input type="file" id="pickChat" multiple hidden />
        </form>
      </section>
    </main>

    <nav class="tabbar" aria-label="视图切换">
      <button type="button" data-view="chat" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.9 9.9 0 0 1-3.9-.8L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z" />
        </svg>
        聊天
      </button>
      <button type="button" data-view="files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7a2 2 0 0 1 2-2h3.5l2 2.5H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" />
        </svg>
        文件
      </button>
    </nav>
  </div>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div>
      <strong>松手即上传</strong>
      <span>文件会分享给房间里所有设备</span>
    </div>
  </div>

  <div class="modal" id="qrModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>扫码加入</h3>
        <button type="button" class="modal-close" data-close aria-label="关闭">×</button>
      </div>
      <div class="qr-box" id="qrBox"></div>
      <p class="qr-url" id="qrUrl"></p>
      <div class="qr-alts" id="qrAlts"></div>
      <p class="modal-tip">手机连同一个 Wi-Fi，扫码即可进入当前会话</p>
    </div>
  </div>

  <div class="modal" id="sessionModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>历史会话</h3>
        <button type="button" class="modal-close" data-close aria-label="关闭">×</button>
      </div>
      <ul class="session-list" id="sessionList"></ul>
      <p class="modal-tip">切换后所有设备一起进入所选会话，原会话不受影响</p>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="./vendor/qrcode.js"></script>
  <script src="./app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codex 控制台 · 局域网文件传输</title>
  <style>
    :root {
      --bg: #0f1216; --panel: #171b21; --line: #262c36; --text: #e8ecf4;
      --muted: #8d97a8; --accent: #5b8cff; --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font: 14px/1.6 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .meta { color: var(--muted); font-size: 12px; }
    .meta b { color: var(--text); font-weight: 600; }
    .spacer { flex: 1; }
    .badge {
      padding: 2px 9px; border-radius: 999px; font-size: 12px;
      background: rgba(91,140,255,.16); color: var(--accent);
    }
    main { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
    .tasks { border-right: 1px solid var(--line); overflow-y: auto; }
    .task {
      padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
    }
    .task:hover { background: #1b2028; }
    .task.active { background: #1e2530; border-left: 3px solid var(--accent); }
    .task-top { display: flex; align-items: center; gap: 8px; }
    .task-prompt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .state { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #232a34; color: var(--muted); }
    .state.running { background: rgba(91,140,255,.18); color: var(--accent); }
    .state.done { background: rgba(34,197,94,.16); color: var(--ok); }
    .state.failed, .state.killed { background: rgba(239,68,68,.16); color: var(--danger); }
    .state.queued, .state.canceled { background: rgba(245,158,11,.16); color: var(--warn); }
    .task-sub { margin-top: 4px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
    .detail { display: flex; flex-direction: column; min-height: 0; }
    .detail-head {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .detail-head .title { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button {
      padding: 5px 14px; border: 1px solid var(--line); border-radius: 9px;
      background: #232a34; color: var(--text); font-size: 13px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.danger { color: #ffd7d7; border-color: #55262a; background: #35191c; }
    button.danger:hover { border-color: var(--danger); color: var(--danger); }
    .stream {
      flex: 1; margin: 0; padding: 14px 16px; overflow-y: auto;
      font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
    .line { display: flex; gap: 10px; padding: 1px 0; }
    .line .kind { flex: none; width: 58px; text-align: right; color: #5a6373; user-select: none; }
    .line .text { flex: 1; }
    .line.command .text { color: #7cc4ff; }
    .line.output .text { color: #9aa4b2; }
    .line.message .text { color: #d8f5e3; }
    .line.error .text { color: #ff9d9d; }
    .line.note .text { color: #f0c674; }
    .line.reasoning .text { color: #c9a6ff; }
    .line.mcp .text { color: #6ee7d7; }
    /* 命令与输出默认折叠：summary 显示一行预览，展开才看全文 */
    details.line { display: block; }
    details.line > summary {
      display: flex; gap: 10px; cursor: pointer; list-style: none;
    }
    details.line > summary::-webkit-details-marker { display: none; }
    details.line > summary::before {
      content: "▸"; flex: none; width: 12px; color: #5a6373; transition: transform .12s;
    }
    details.line[open] > summary::before { transform: rotate(90deg); }
    details.line > summary .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    details.line[open] > summary .text { display: none; }
    details.line > .body { padding-left: 80px; }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
    .group-title { padding: 10px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
    .group-title.foldable { cursor: pointer; user-select: none; }
    .group-title.foldable:hover { color: var(--fg, #ddd); }
    .group-hint { padding: 2px 12px 10px; color: var(--muted); font-size: 12px; }
    .macros { border-top: 1px solid var(--line); padding: 8px 10px 12px; font-size: 12px; }
    .macros .group-title { padding: 4px 2px 8px; }
    .macro { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; }
    .macro:hover { background: rgba(127,127,127,.12); }
    .macro .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .macro .state { color: var(--muted); white-space: nowrap; }
    .macro button { font-size: 11px; padding: 2px 8px; }
    footer { padding: 6px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Codex 控制台</h1>
    <span class="badge" id="enabledBadge">…</span>
    <span class="meta" id="configInfo"></span>
    <span class="spacer"></span>
    <span class="meta" id="summary"></span>
  </header>

  <main>
    <section class="tasks">
      <div id="taskList"></div>
      <div class="macros" id="macroList"></div>
    </section>
    <section class="detail">
      <div class="detail-head">
        <span class="title" id="detailTitle">选择左侧的任务查看过程</span>
        <button type="button" id="foldBtn">全部展开</button>
        <button type="button" class="danger" id="killBtn" disabled>终止这个任务</button>
      </div>
      <pre class="stream" id="stream"></pre>
    </section>
  </main>

  <footer id="footer"></footer>

  <script>
    // 服务可能挂在子路径下（如 /lanfile/agent），所有请求按当前目录推导前缀
    const BASE = location.pathname.replace(/[^/]*$/, '');
    const api = (path) => BASE + path.replace(/^\//, '');

    const el = {
      badge: document.getElementById('enabledBadge'),
      config: document.getElementById('configInfo'),
      summary: document.getElementById('summary'),
      list: document.getElementById('taskList'),
      macros: document.getElementById('macroList'),
      title: document.getElementById('detailTitle'),
      fold: document.getElementById('foldBtn'),
      kill: document.getElementById('killBtn'),
      stream: document.getElementById('stream'),
      footer: document.getElementById('footer'),
    };

    let selected = '';
    let tasks = [];
    let macros = [];
    let foldDone = true;              // 「已完成」任务默认收起
    let foldMacros = true;            // 技能库默认收起
    let stopped = false;
    let expandAll = false;            // 「全部展开」按钮：控制折叠项默认是否打开
    const userOpen = new Map();       // 用户手动点开/收起过的行（刷新后保持）

    const foldable = (kind) => kind === 'command' || kind === 'output';

    const fmtTime = (ms) => (ms ? new Date(ms).toLocaleTimeString('zh-CN', { hour12: false }) : '—');
    const fmtDuration = (task) => {
      if (!task.startedAt) return '排队中';
      const end = task.finishedAt || Date.now();
      const sec = ((end - task.startedAt) / 1000).toFixed(1);
      return `${sec}s`;
    };
    const fmtTokens = (usage) => {
      if (!usage) return '—';
      const total = usage.inputTokens + usage.outputTokens;
      return `${total.toLocaleString()} tok（缓存 ${Math.round((usage.cachedInputTokens / Math.max(usage.inputTokens, 1)) * 100)}%）`;
    };

    function render() {
      if (!tasks.length) {
        el.list.innerHTML = '<div class="empty">还没有任务。在聊天室里发一条带 @Codex 的消息试试。</div>';
      } else {
        const active = tasks.filter((task) => task.status === 'running' || task.status === 'queued');
        const finished = tasks.filter((task) => task.status !== 'running' && task.status !== 'queued');
        const card = (task) => `<div class="task ${task.id === selected ? 'active' : ''}" data-id="${task.id}">
                <div class="task-top">
                  <span class="state ${task.status}">${statusText(task.status)}</span>
                  <span class="task-prompt">${escapeHtml(task.prompt || '(空消息)')}</span>
                </div>
                <div class="task-sub">
                  <span>${escapeHtml(task.from || '未知')}</span>
                  <span>${fmtTime(task.queuedAt)}</span>
                  <span>${fmtDuration(task)}</span>
                  <span>${fmtTokens(task.usage)}</span>
                </div>
              </div>`;

        let html = '';
        if (active.length) {
          html += `<div class="group-title">进行中 (${active.length})</div>` + active.map(card).join('');
        } else {
          html += '<div class="group-title">进行中 (0)</div><div class="group-hint">没有正在跑的任务</div>';
        }
        if (finished.length) {
          // 已经跑完的任务收纳起来，默认收起（要看就点这一行）
          html += `<div class="group-title foldable" id="doneToggle">${foldDone ? '▸' : '▾'} 已完成 (${finished.length})</div>`;
          if (foldDone) {
            const inFold = finished.some((task) => task.id === selected);
            html += inFold ? '<div class="group-hint">正在看的任务已收起 —— 点上面的标题展开</div>' : '';
          } else {
            html += finished.map(card).join('');
          }
        }
        el.list.innerHTML = html;
      }

      const current = tasks.find((task) => task.id === selected);
      if (!current) {
        el.title.textContent = '选择左侧的任务查看过程';
        el.stream.innerHTML = '<div class="empty">暂无输出</div>';
        el.kill.disabled = true;
        return;
      }

      el.title.textContent = `${current.prompt || '(空消息)'} · ${statusText(current.status)} · ${fmtDuration(current)}`;
      el.kill.disabled = !(current.status === 'running' || current.status === 'queued');
      el.stream.innerHTML = current.lines?.length
        ? current.lines
            .map((line, index) => {
              const key = `${current.id}:${index}`;
              const body = escapeHtml(line.text);
              const preview = escapeHtml(line.text.split('\n')[0].slice(0, 120));
              if (!foldable(line.kind)) {
                return `<div class="line ${line.kind}">
                    <span class="kind">${kindText(line.kind)}</span>
                    <span class="text">${body}</span>
                  </div>`;
              }
              // 用户手动动过的行以手动状态为准，其余跟随全局开关
              const open = userOpen.has(key) ? userOpen.get(key) : expandAll;
              return `<details class="line ${line.kind}" data-key="${key}"${open ? ' open' : ''}>
                  <summary>
                    <span class="kind">${kindText(line.kind)}</span>
                    <span class="text">${preview}</span>
                  </summary>
                  <div class="body text">${body}</div>
                </details>`;
            })
            .join('')
        : '<div class="empty">这个任务还没有输出</div>';

      if (current.status === 'running' || current.status === 'queued') {
        el.stream.scrollTop = el.stream.scrollHeight;
      }
    }

    function statusText(status) {
      return { queued: '排队中', running: '执行中', done: '已完成', failed: '失败', killed: '已终止', canceled: '已取消' }[status] || status;
    }
    function kindText(kind) {
      return { command: '命令', output: '输出', message: '回复', error: '错误', note: '说明', raw: '原始', reasoning: '思考', mcp: 'MCP', macro: '技能', warn: '⚠️ 注意' }[kind] || kind;
    }
    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    }

    // 技能库：任务成功后会沉淀成"宏"，同一意图成功 2 次即可直跑（模型不参与）。
    function macroState(macro) {
      if (macro.disabled) return `已停用（连续失败 ${macro.failures} 次）`;
      return `可直跑 · 成功 ${macro.successes} 次${macro.failures ? `／连续失败 ${macro.failures}` : ''}`;
    }
    function renderMacros() {
      if (!macros.length) {
        el.macros.innerHTML = '<div class="group-title" id="macroToggle">▸ 技能库 (0)</div>'
          + (foldMacros ? '' : '<div class="group-hint">还没有沉淀技能：任务成功一次后自动生成。</div>');
        return;
      }
      const head = `<div class="group-title foldable" id="macroToggle">${foldMacros ? '▸' : '▾'} 技能库 (${macros.length})</div>`;
      if (foldMacros) { el.macros.innerHTML = head; return; }
      el.macros.innerHTML = head + macros.map((m) => `
        <div class="macro">
          <span class="name" title="${escapeHtml(m.prompt || '')}｜${escapeHtml((m.steps || []).map((s) => s.tool).join(' → '))}">${escapeHtml(m.prompt || m.intent)}</span>
          <span class="state">${escapeHtml(macroState(m))}</span>
          <button type="button" class="danger" data-intent="${escapeHtml(m.intent)}">删除</button>
        </div>`).join('');
    }

    async function refresh() {
      if (stopped) return;
      try {
        const res = await fetch(api('/api/agent/tasks'));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        try {
          const mres = await fetch(api('/api/agent/macros'));
          if (mres.ok) macros = (await mres.json()).macros || [];
        } catch { /* 技能库拿不到不影响任务列表 */ }

        tasks = data.tasks || [];
        if (!selected && tasks.length) selected = tasks[0].id;
        if (selected && !tasks.some((task) => task.id === selected)) selected = tasks[0]?.id || '';

        el.badge.textContent = data.enabled ? '已启用' : '未启用（启动服务时加 -agent）';
        el.badge.style.color = data.enabled ? 'var(--ok)' : 'var(--danger)';
        el.config.textContent = `触发词 ${data.trigger} · 工作目录 ${data.cwd} · 超时 ${data.timeout}s`;
        el.summary.textContent = `执行中 ${data.running} · 排队 ${data.queued} · 最近任务累计 ${(data.totalTokens || 0).toLocaleString()} token`;
        render();
        renderMacros();
      } catch (error) {
        el.footer.textContent = `刷新失败：${error.message}（请确认你是用主机身份打开的，且服务在运行）`;
      }
    }

    el.list.addEventListener('click', (event) => {
      if (event.target.closest('#doneToggle')) {   // 点标题行：展开/收起已完成
        foldDone = !foldDone;
        render();
        return;
      }
      if (event.target.closest('#macroList button')) return; // 技能库的删除按钮自己处理
      const item = event.target.closest('.task');
      if (!item) return;
      selected = item.dataset.id;
      render();
    });

    // 折叠状态：只记"用户点了哪几行"（用 click 而不是 toggle，
    // 否则程序化渲染也会触发 toggle，导致「全部折叠」失效）
    el.stream.addEventListener('click', (event) => {
      const summary = event.target.closest('summary');
      if (!summary) return;
      const node = summary.parentElement;
      if (!node?.dataset?.key) return;
      // 浏览器在这一轮事件之后才切换 open，等一拍再读
      setTimeout(() => userOpen.set(node.dataset.key, node.open), 0);
    });

    el.fold.addEventListener('click', () => {
      expandAll = !expandAll;
      userOpen.clear(); // 清掉手动记录，这样「全部展开」和「全部折叠」都生效
      el.fold.textContent = expandAll ? '全部折叠' : '全部展开';
      render();
    });

    el.macros.addEventListener('click', async (event) => {
      if (event.target.closest('#macroToggle')) {  // 点标题行：展开/收起技能库
        foldMacros = !foldMacros;
        renderMacros();
        return;
      }
      const btn = event.target.closest('button[data-intent]');
      if (!btn) return;
      const intent = btn.dataset.intent;
      if (!confirm('删除这条技能？下次同类任务会重新走模型决策。')) return;
      try {
        await fetch(api('/api/agent/macros?intent=' + encodeURIComponent(intent)), { method: 'DELETE' });
        refresh();
      } catch (error) {
        el.footer.textContent = `删除失败：${error.message}`;
      }
    });

    el.kill.addEventListener('click', async () => {
      if (!selected) return;
      if (!window.confirm('终止这个任务？它会连同子进程一起被杀掉。')) return;
      try {
        const res = await fetch(api(`/api/agent/tasks/${selected}/kill`), { method: 'POST' });
        const data = await res.json().catch(() => ({}));
        el.footer.textContent = res.ok ? '已发送终止请求' : `终止失败：${data.error || res.status}`;
        refresh();
      } catch (error) {
        el.footer.textContent = `终止失败：${error.message}`;
      }
    });

    window.addEventListener('beforeunload', () => { stopped = true; });

    refresh();
    setInterval(refresh, 800); // 轮询：比 SSE 简单，穿 nginx 也不会被缓冲
  </script>
</body>
</html>
